{% extends "blog/base.html" %}
{%block content%}
    {% if name == 'Salaar'%}
        <p>Hello, Salaar!</p>
    {% else %}
        <p>Hello, {{ name }}!</p>
    {% endif %}
    <p>Semester: {{ Semester }}</p>
    <p>Hobbies are:</p>
    <ul>
    {% for hobby in Hobbies%}
    <li>{{hobby}}</li>
    {% endfor %}
    </ul>
{% endblock%}
