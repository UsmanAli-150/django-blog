{% extends "blog/base.html" %}

{% block content %}
    <h1>My Blog</h1>
    {% for post in posts %}
        <div>
            <h2><a href="/post/{{ post.id }}/">{{ post.title }}</a></h2>
        <p>{{ post.content }}</p>
        <small>By {{ post.author }} — {{ post.date_created }}</small>
    </div>
    <hr>
{% endfor %}
{% endblock %}
