{% extends "blog/base.html" %}
{% block content %}
    <h1>Delete "{{ post.title }}"?</h1>
    <p>This cannot be undone.</p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit">Yes, delete</button>
        <a href="{% url 'post_detail' post.pk %}">Cancel</a>
    </form>
{% endblock %}
