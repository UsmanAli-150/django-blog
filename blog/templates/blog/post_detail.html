{% extends "blog/base.html" %}

{% block content %}
    <h1>Total Posts: {{ total_posts }}</h1>
    <h1>{{ post.title }}</h1>
    <p>{{ post.content }}</p>
    <small>By {{ post.author }} — {{ post.date_created }}</small>
    <br><br>
    
    <a href="{% url 'edit_post' post.pk %}">Edit</a> |
    <a href="{% url 'delete_post' post.pk %}">Delete</a><br/><br/>

    <a href="/">← Back to Home</a>
{% endblock %}
