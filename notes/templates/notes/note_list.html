{% extends 'notes/base.html' %}

{% block content %}
    <h1>My Notes</h1>
    <p><a href="{% url 'note_create' %}">+ Add New Note</a></p>

    <ul>
        {% for note in notes %}
        <li>
            {% if note.is_important %}⭐{% endif %}
            <a href="{% url 'note_detail' note.pk %}">{{ note.title }}</a>
            — <a href="{% url 'note_edit' note.pk %}">Edit</a>
            — <a href="{% url 'note_delete' note.pk %}">Delete</a>
        </li>
        {% empty %}
        <li>No notes available.</li>
        {% endfor %}
    </ul>
{% endblock %}
