{% extends 'notes/base.html' %}

{% block content %}
    <h1>Delete "{{ note.title }}"?</h1>
    <p>Are you sure you want to delete this note?</p>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit" style="background: red; color: white; padding: 5px 10px; border: none; cursor: pointer;">Yes, delete</button>
    </form>
    <br>
    <a href="{% url 'note_list' %}">Cancel</a>
{% endblock %}
