<h1>Tasks</h1>
<p><a href="{% url 'task_create' %}">+ Add New Task</a></p>
<ul>
  {% for task in tasks %}
    <li>
      {% if task.done %}✅{% endif %}
      <a href="{% url 'task_detail' task.pk %}">{{ task.title }}</a>
      — <a href="{% url 'task_edit' task.pk %}">Edit</a>
      — <a href="{% url 'task_delete' task.pk %}">Delete</a>
    </li>
  {% empty %}
    <li>No tasks yet.</li>
  {% endfor %}
</ul>
